services:
  app:
    build:
      context: .
    restart: always
    environment:
      FLASK_ENV: production
      SECRET_KEY: dia-d-production-secret-key-change-immediately
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/electoral_db
      S3_ENABLED: "True"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: electoral-evidencias
      S3_USE_SSL: "False"
      CHROMA_ENABLED: "False"
      CHROMA_PERSIST_DIR: /data/chroma
      CHROMA_SERVER_HOST: ""
      PORT: "5000"
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "5000:5000"
    volumes:
      - ./instance:/app/instance
      - ./uploads:/app/uploads

  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: electoral_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d electoral_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
