services:
  app:
    build:
      context: .
    restart: always
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/electoral_db
      RESET_DB: "false"
      S3_ENABLED: "True"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: electoral-evidencias
      S3_USE_SSL: "False"
      CHROMA_ENABLED: "False"
      CHROMA_PERSIST_DIR: /data/chroma
      CHROMA_SERVER_HOST: ""
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
    expose:
      - 5000
    volumes:
      - instance_data:/app/instance
      - uploads_data:/app/uploads

  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: electoral_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
  instance_data:
  uploads_data:
