version: '3.8'

services:
  app:
    build: .
    container_name: dia_d_app
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/electoral_db
      - S3_ENABLED=True
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=electoral-evidencias
      - S3_USE_SSL=False
      - CHROMA_ENABLED=True
      - CHROMA_PERSIST_DIR=/data/chroma
      - CHROMA_SERVER_HOST=
      - PORT=5000
    depends_on:
      - postgres
      - minio
      - chroma
    ports:
      - "5000:5000"
    volumes:
      - ./instance:/app/instance
      - ./uploads:/app/uploads
      - chroma_data:/app/chroma_db

  postgres:
    image: postgres:15
    container_name: dia_d_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: electoral_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:RELEASE.2026-01-01T00-00-00Z
    container_name: dia_d_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  chroma:
    image: chromadb/chromadb:latest
    container_name: dia_d_chroma
    environment:
      # If using the server mode, set CHROMA_SERVER_HOST/PORT
      - CHROMA_SERVER_HTTP_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data

volumes:
  postgres_data:
  minio_data:
  chroma_data:
