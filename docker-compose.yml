services:
  app:
    build:
      context: .
    container_name: dia_d_app        # ❌ ELIMINADO - Dokploy no permite container_name
    restart: always
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/electoral_db
      S3_ENABLED: "True"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: electoral-evidencias
      S3_USE_SSL: "False"
      CHROMA_ENABLED: "False"
      CHROMA_PERSIST_DIR: /data/chroma
      CHROMA_SERVER_HOST: ""
      PORT: "5000"
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    # ✅ SOLO el puerto interno (Dokploy/Traefik gestiona el dominio)
    expose:
      - 5000
    volumes:
      # ✅ named volumes en vez de rutas relativas ./ (más confiable en Dokploy)
      - instance_data:/app/instance
      - uploads_data:/app/uploads
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.diad-app.rule=Host(`tu-dominio.com`)"   # ⚠️ pon tu dominio
      - "traefik.http.routers.diad-app.entrypoints=websecure"
      - "traefik.http.routers.diad-app.tls.certResolver=letsencrypt"
      - "traefik.http.services.diad-app.loadbalancer.server.port=5000"

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: electoral_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d electoral_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [dokploy-network]      # ❌ sin puertos externos: solo red interna

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks: [dokploy-network]
    # ❌ sin puertos externos

volumes:
  postgres_data:
  minio_data:
  instanc_data:
  uploads_data:

networks:
  dokploy-network:
    external: true
