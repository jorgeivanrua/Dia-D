<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema Electoral E-14/E-24{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/mobile-responsive.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/dia-d-theme.css') }}" rel="stylesheet">
    
    <!-- Modern Dashboard CSS -->
    <link href="{{ url_for('static', filename='css/modern-dashboard.css') }}?v=20251201" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/notificaciones.css') }}?v=20251201" rel="stylesheet">
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container-fluid">
        {% block content %}{% endblock %}
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/api-client.js') }}?v=20251130"></script>
    <script src="{{ url_for('static', filename='js/utils.js') }}?v=20251130"></script>
    <script src="{{ url_for('static', filename='js/session-manager.js') }}?v=20251130"></script>
    <script src="{{ url_for('static', filename='js/location-loader.js') }}?v=20251130"></script>
    <script src="{{ url_for('static', filename='js/verificacion-presencia.js') }}?v=20251130"></script>
    <script src="{{ url_for('static', filename='js/mapa-geolocalizacion.js') }}?v=20251130"></script>
    
    <!-- Offline Support -->
    <script src="{{ url_for('static', filename='js/indexeddb-service.js') }}?v=20251201"></script>
    <script src="{{ url_for('static', filename='js/sync-manager-offline.js') }}?v=20251201"></script>
    <script src="{{ url_for('static', filename='js/offline-indicators.js') }}?v=20251201"></script>
    <script src="{{ url_for('static', filename='js/reportes-pendientes-panel.js') }}?v=20251201"></script>
    <script src="{{ url_for('static', filename='js/formularios-offline.js') }}?v=20251201"></script>
    
    <!-- Logo Fallback - Genera SVG localmente para logos de partidos -->
    <script src="{{ url_for('static', filename='js/logo-fallback.js') }}?v=20251201"></script>
    
    <!-- Modern Animations -->
    <script src="{{ url_for('static', filename='js/modern-animations.js') }}?v=20251201"></script>
    
    <!-- Notificaciones (REST polling) -->
    <script src="{{ url_for('static', filename='js/notificaciones-manager.js') }}?v=20251201"></script>
    <script src="{{ url_for('static', filename='js/notificaciones-panel.js') }}?v=20251201"></script>
    
    <!-- Inicializar verificación de presencia -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // NO inicializar en página de login
            const isLoginPage = window.location.pathname.includes('/auth/login') || 
                               window.location.pathname === '/' ||
                               window.location.pathname === '/login';
            
            // Solo inicializar si hay token Y no estamos en login
            if (!isLoginPage && localStorage.getItem('access_token')) {
                if (window.verificacionPresencia) {
                    window.verificacionPresencia.init();
                }
            }
        });
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
