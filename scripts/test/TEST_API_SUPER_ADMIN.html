<!DOCTYPE html>
<html>
<head>
    <title>Test API Super Admin</title>
</head>
<body>
    <h1>Test API Super Admin</h1>
    <button onclick="testStats()">Test Stats</button>
    <button onclick="testUsers()">Test Users</button>
    <pre id="output"></pre>

    <script>
        const output = document.getElementById('output');
        
        async function testStats() {
            try {
                output.textContent = 'Cargando stats...';
                const response = await fetch('/api/super-admin/stats', {
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    }
                });
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
            }
        }
        
        async function testUsers() {
            try {
                output.textContent = 'Cargando users...';
                const response = await fetch('/api/super-admin/users', {
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    }
                });
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
