<!DOCTYPE html>
<html>
<head>
    <title>Test Mapa Geolocalización</title>
    <script>
        async function testEndpoint() {
            try {
                // Primero hacer login
                const loginResponse = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nombre: 'Super Admin',
                        password: 'admin123'
                    })
                });
                
                const loginData = await loginResponse.json();
                console.log('Login response:', loginData);
                
                if (loginData.success && loginData.access_token) {
                    // Ahora probar el endpoint de puestos
                    const puestosResponse = await fetch('http://localhost:5000/api/locations/puestos-geolocalizados', {
                        headers: {
                            'Authorization': `Bearer ${loginData.access_token}`
                        }
                    });
                    
                    const puestosData = await puestosResponse.json();
                    console.log('Puestos response:', puestosData);
                    
                    if (puestosData.success) {
                        document.getElementById('result').innerHTML = `
                            <h2>✓ Endpoint funcionando correctamente</h2>
                            <p>Total de puestos: ${puestosData.data.length}</p>
                            <h3>Primeros 3 puestos:</h3>
                            <pre>${JSON.stringify(puestosData.data.slice(0, 3), null, 2)}</pre>
                        `;
                    } else {
                        document.getElementById('result').innerHTML = `
                            <h2>✗ Error en endpoint</h2>
                            <p>${puestosData.error}</p>
                        `;
                    }
                } else {
                    document.getElementById('result').innerHTML = `
                        <h2>✗ Error en login</h2>
                        <p>${loginData.error || 'Error desconocido'}</p>
                    `;
                }
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `
                    <h2>✗ Error de conexión</h2>
                    <p>${error.message}</p>
                `;
            }
        }
    </script>
</head>
<body>
    <h1>Test Endpoint Puestos Geolocalizados</h1>
    <button onclick="testEndpoint()">Probar Endpoint</button>
    <div id="result"></div>
</body>
</html>
